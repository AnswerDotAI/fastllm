[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-fastllm"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kerem Turgutlu", email = "keremturgutlu@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ['fastcore>=2.1.18', 'aidialog>=0.0.25', 'fasttransport>=0.0.2', 'pillow']

[project.scripts]
fastllm-auth = "fastllm.codex:main"

[project.urls]
Repository = "https://github.com/AnswerDotAI/fastllm"

[project.entry-points.nbdev]
fastllm = "fastllm._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "fastllm.__version__"}

[tool.setuptools.packages.find]
include = ["fastllm*"]

[project.entry-points.fastaudit_import_allow]
fastllm = "fastllm"

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai']
custom_sidebar = false
lib_path = "fastllm"

[tool.chkstyle]
skip_paths = ["_modidx.py"]
ignore = ["undocumented-export", "exported-run"]
